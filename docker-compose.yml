services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      RICK_AND_MORTY_API_URL: https://rickandmortyapi.com/api
      REQUEST_TIMEOUT_MS: 6000
      CACHE_TTL_MS: 60000
      ALLOWED_ORIGINS: "*"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
